services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nyc_aging_menu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nyc_aging_menu"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/nyc_aging_menu
      AUTO_SEED_DB: "true"
      FRONTEND_URL: http://localhost:5050
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  blazor-ui:
    build:
      context: .
      dockerfile: blazor-ui/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PythonApi__BaseUrl: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5050:5050"

volumes:
  pgdata:
